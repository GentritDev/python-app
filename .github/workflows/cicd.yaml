
name: CI-CD Pipeline

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      short_sha: ${{ steps.set_sha.outputs.short_sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Short SHA
        id: set_sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/python-app:${{ steps.set_sha.outputs.short_sha }}

  update-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.short_sha }}
      IMAGE: ${{ secrets.DOCKER_USERNAME }}/python-app:${{ needs.build-and-push.outputs.short_sha }}
      MANIFEST_PATH: k8s/deployment.yaml

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update Kubernetes Manifest
        run: |
          python - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          path = Path(os.environ["MANIFEST_PATH"])
          image = os.environ["IMAGE"]

          if not path.exists():
              sys.exit(f"Manifest not found: {path}")

          content = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r"(?m)^([ \t]*image:[ \t]*)(?:\S*/)?python-app(?::\S+)?([ \t]*(?:#.*)?)$"
          )

          updated, count = pattern.subn(
              lambda match: f"{match.group(1)}{image}{match.group(2)}",
              content
          )

          if count == 0:
              sys.exit("ERROR: Could not find python-app image in manifest.")

          path.write_text(updated, encoding="utf-8")

          print(f"Manifest updated to: {image}")
          PY

      - name: Commit and Push Changes
        run: |
          git add "$MANIFEST_PATH"

          if git diff --cached --quiet; then
            echo "No manifest changes detected."
          else
            git commit -m "Update Docker image to ${IMAGE_TAG}"
            git push origin HEAD:main
          fi
